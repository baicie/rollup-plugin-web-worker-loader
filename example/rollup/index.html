<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollup Web Worker Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        #output {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
        }
        .log {
            font-family: monospace;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .log:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Rollup Web Worker Loader Example</h1>
    <p>Open the browser console to see worker output.</p>
    <div id="output">
        <div class="log">Check console for worker messages...</div>
    </div>
    <script type="module" src="./dist/bundle.js"></script>
    <script>
        const output = document.getElementById('output');
        const originalLog = console.log;
        const originalError = console.error;

        console.log = (...args) => {
            originalLog.apply(console, args);
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = '[LOG] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            output.appendChild(div);
        };

        console.error = (...args) => {
            originalError.apply(console, args);
            const div = document.createElement('div');
            div.className = 'log';
            div.style.color = '#d32f2f';
            div.textContent = '[ERROR] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            output.appendChild(div);
        };
    </script>
</body>
</html>
